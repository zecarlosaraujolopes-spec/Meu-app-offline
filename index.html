<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA Magnato Privada</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#89b4fa">
  <link rel="icon" href="./icon-192.png">
  <meta name="description" content="Assistente de IA 100% offline e privada">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#11111b;color:#cdd6f4;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
    header{padding:16px;background:#181825;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:16px;display:flex;gap:8px;align-items:center}
    .badge{background:#89b4fa20;color:#89b4fa;padding:4px 8px;border-radius:8px;font-size:10px;border:1px solid #89b4fa20}
    main{flex:1;display:flex;flex-direction:column;max-width:980px;margin:0 auto;width:100%;padding:16px;gap:16px}
    .chat{flex:1;background:#1e1e2e;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px;overflow-y:auto;min-height:400px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:82%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
    .msg.user{align-self:flex-end;background:#89b4fa;color:#1e1e2e;border-bottom-right-radius:6px}
    .msg.ia{align-self:flex-start;background:#313244;border-bottom-left-radius:6px}
    .input-area{display:flex;gap:8px;background:#1e1e2e;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.06)}
    .input-area input{flex:1;background:transparent;border:none;outline:none;color:#cdd6f4;font-size:15px}
    .input-area button{background:#89b4fa;color:#1e1e2e;border:none;padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer}
    .tabs{display:flex;gap:8px}
    .tab{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);cursor:pointer;font-size:12px}
    .tab.active{background:#89b4fa15;border-color:#89b4fa33;color:#89b4fa}
    .panel{display:none;background:#1e1e2e;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px}
    .panel.active{display:block}
    textarea{width:100%;background:#11111b;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;color:#cdd6f4;resize:none;min-height:80px}
  </style>
</head>
<body>
  <header>
    <h1>🧠 IA Magnato Privada</h1>
    <span class="badge">100% OFFLINE</span>
  </header>
  <main>
    <div class="tabs">
      <div class="tab active" onclick="showTab('chat')">Chat</div>
      <div class="tab" onclick="showTab('memoria')">Memória</div>
      <div class="tab" onclick="showTab('config')">Config</div>
    </div>

    <div id="panel-chat" class="panel active">
      <div id="chat" class="chat">
        <div class="msg ia">Olá! Eu sou a IA Magnato, 100% offline e privada. Como posso te ajudar hoje?</div>
      </div>
      <div class="input-area" style="margin-top:12px">
        <input id="input" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">Enviar</button>
      </div>
    </div>

    <div id="panel-memoria" class="panel">
      <h3 style="margin-bottom:8px">Memórias salvas</h3>
      <div id="memoria-list" style="font-size:13px;opacity:.8"></div>
      <textarea id="nova-memoria" placeholder="Adicionar nova memória..."></textarea>
      <button onclick="addMemoria()" style="margin-top:8px;background:#a6e3a1;color:#1e1e2e;border:none;padding:8px 14px;border-radius:8px;cursor:pointer">Salvar memória</button>
    </div>

    <div id="panel-config" class="panel">
      <h3>Configuração</h3>
      <p style="font-size:12px;opacity:.6;margin:8px 0">Personalidade da IA</p>
      <textarea id="personalidade">Você é a IA Magnato, assistente privada, prestativa e direta. Funciona 100% offline.</textarea>
      <button onclick="saveConfig()" style="margin-top:8px;background:#89b4fa;color:#1e1e2e;border:none;padding:8px 14px;border-radius:8px;cursor:pointer">Salvar</button>
      <button onclick="clearChat()" style="margin-top:8px;background:#f38ba820;color:#f38ba8;border:1px solid #f38ba820;padding:8px 14px;border-radius:8px;cursor:pointer;margin-left:8px">Limpar chat</button>
    </div>
  </main>

  <script>
    const CHAT_KEY = 'ia_magnato_chat';
    const MEM_KEY = 'ia_magnato_memorias';
    const CFG_KEY = 'ia_magnato_config';

    let memorias = JSON.parse(localStorage.getItem(MEM_KEY) || '[]');
    let config = JSON.parse(localStorage.getItem(CFG_KEY) || '{"personalidade":"Você é a IA Magnato, assistente privada, prestativa e direta. Funciona 100% offline."}');
    document.getElementById('personalidade').value = config.personalidade;

    function showTab(t){
      document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
      document.querySelector(`[onclick="showTab('${t}')"]`).classList.add('active');
      document.getElementById('panel-'+t).classList.add('active');
      if(t==='memoria') renderMemorias();
    }

    function renderMemorias(){
      const el = document.getElementById('memoria-list');
      if(memorias.length===0) el.innerHTML = '<p>Nenhuma memória ainda.</p>';
      else el.innerHTML = memorias.map((m,i)=>`<div style="background:#11111b;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between"><span>${m}</span><span style="cursor:pointer" onclick="delMem(${i})">🗑️</span></div>`).join('');
    }

    function addMemoria(){
      const v = document.getElementById('nova-memoria').value.trim();
      if(!v) return;
      memorias.push(v);
      localStorage.setItem(MEM_KEY, JSON.stringify(memorias));
      document.getElementById('nova-memoria').value='';
      renderMemorias();
    }
    function delMem(i){ memorias.splice(i,1); localStorage.setItem(MEM_KEY, JSON.stringify(memorias)); renderMemorias(); }

    function saveConfig(){
      config.personalidade = document.getElementById('personalidade').value;
      localStorage.setItem(CFG_KEY, JSON.stringify(config));
      alert('Config salva!');
    }

    function loadChat(){
      const data = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
      const chat = document.getElementById('chat');
      chat.innerHTML = data.length? '' : '<div class="msg ia">Olá! Eu sou a IA Magnato, 100% offline e privada. Como posso te ajudar hoje?</div>';
      data.forEach(m=>{
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role==='user'?'user':'ia');
        div.textContent = m.text;
        chat.appendChild(div);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function send(){
      const input = document.getElementById('input');
      const text = input.value.trim();
      if(!text) return;
      const chat = document.getElementById('chat');
      const u = document.createElement('div'); u.className='msg user'; u.textContent=text; chat.appendChild(u);

      // resposta simples offline baseada em memória e config
      let resposta = 'Entendido: "'+text+'". ';
      if(memorias.length) resposta += 'Lembrei que você salvou: '+memorias.slice(-2).join(', ')+'. ';
      else resposta += 'Estou funcionando 100% offline, sem enviar nada pra internet. ';
      resposta += '\n\nComo posso te ajudar mais?';

      setTimeout(()=>{
        const a = document.createElement('div'); a.className='msg ia'; a.textContent=resposta; chat.appendChild(a);
        chat.scrollTop = chat.scrollHeight;
        // salvar
        const history = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
        history.push({role:'user', text}, {role:'ia', text:resposta});
        localStorage.setItem(CHAT_KEY, JSON.stringify(history));
      }, 400);

      input.value='';
      chat.scrollTop = chat.scrollHeight;
    }

    function clearChat(){ localStorage.removeItem(CHAT_KEY); loadChat(); }

    loadChat();

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
